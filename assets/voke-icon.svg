<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Windows 11 深板岩微渐变底板 -->
    <linearGradient id="voke-bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1B1E27" />
      <stop offset="100%" stop-color="#101115" />
    </linearGradient>

    <!-- 探照镜身电光青渐变 (Electric Mint) -->
    <linearGradient id="voke-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46F5D0" />
      <stop offset="50%" stop-color="#22D4B0" />
      <stop offset="100%" stop-color="#0CA88D" />
    </linearGradient>

    <!-- 终端提示符与光标太阳金渐变 (Solar Amber) -->
    <linearGradient id="voke-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD15C" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>

    <!-- 内部深色透镜玻璃微渐变 -->
    <radialGradient id="lens-glass" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161E28" />
      <stop offset="100%" stop-color="#0F1218" />
    </radialGradient>

    <!-- 环境柔和辉光 -->
    <filter id="voke-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. 圆角底板与边缘微光轮廓 -->
  <rect x="0" y="0" width="1024" height="1024" rx="140" ry="140" fill="url(#voke-bg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2.5" />

  <g transform="translate(512,512) scale(1.38) translate(-512,-512)">
  <!-- 2. 环境氛围背光层 -->
  <g opacity="0.35" filter="url(#voke-glow)">
    <circle cx="462" cy="452" r="220" fill="none" stroke="#2DE2B6" stroke-width="52" />
    <line x1="582" y1="572" x2="747" y2="737" stroke="#2DE2B6" stroke-width="62" stroke-linecap="round" />
  </g>

  <!-- 3. 加粗短小精悍的手柄（45° 人体工学射线） -->
  <line x1="582" y1="572" x2="747" y2="737" stroke="url(#voke-cyan)" stroke-width="62" stroke-linecap="round" />

  <!-- 4. 透镜内部暗色蓝宝石镀膜玻璃 -->
  <circle cx="462" cy="452" r="168" fill="url(#lens-glass)" />

  <!-- 5. 放大的探照镜外环（电光青） -->
  <circle cx="462" cy="452" r="194" fill="none" stroke="url(#voke-cyan)" stroke-width="52" />

  <!-- 6. 左上角弧形玻璃高光反射条 -->
  <path d="M 324 314 A 194 194 0 0 1 462 258" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="6" stroke-linecap="round" />

  <!-- 7. 终端命令行提示符 `>`（太阳金，粗度强化） -->
  <polyline points="382,387 447,452 382,517" fill="none" stroke="url(#voke-amber)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 8. 终端正在闪烁的光标 `_`（采用圆角胶囊矩形，100% 保证全平台稳定渲染） -->
  <rect x="480" y="500" width="76" height="28" rx="14" ry="14" fill="url(#voke-amber)" />
  </g>
</svg>