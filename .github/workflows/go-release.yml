# Go 版 Voke 的 CD：复用生产安装器 packaging/voke.iss（AppId/安装路径/图标同生产，
# 通过 -dVokeExe 指向 Go 构建的 voke.exe），产出与生产同名形态的安装包 + portable zip。
#
# 触发：
#   - 打 tag `go-vX.Y.Z`（自动建 GitHub Release）；
#   - 或手动 workflow_dispatch（填版本号，只出构建产物）。
# 说明：主线现有 release.yml 仍由 `v*` tag 驱动 Rust 构建；本版合并进主线后可二选一
# 或改成统一发版流程（届时把 tag 规则/产物来源切到 Go 即可）。
name: go-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（三段，如 0.2.0，不带 v）'
        required: true
        type: string
  push:
    tags:
      - 'go-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: poc/voke-go/go.mod
          cache-dependency-path: poc/voke-go/go.sum

      # 事件字段一律经 env 传入再校验，不直接插值进 shell（防注入）。
      - name: 解析版本号
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'push') {
            $ver = $env:REF_NAME -replace '^go-v', ''
          } else {
            $ver = $env:INPUT_VERSION
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "版本号不合法（需三段数字）：$ver" }
          "VOKE_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "版本：$ver"

      - name: go build（Windows GUI，含 exe 图标 syso）
        working-directory: poc/voke-go
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go build -tags mygo_noinspector -ldflags="-s -w -H windowsgui" -o voke.exe .
          if ($LASTEXITCODE -ne 0) { throw "go build 失败（exit=$LASTEXITCODE）" }

      - name: 安装 Inno Setup 7
        uses: ./.github/actions/install-inno7

      - name: 生成安装包（复用生产 voke.iss，-dVokeExe 指向 Go 产物）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $goExe = (Resolve-Path 'poc\voke-go\voke.exe').Path
          & $env:ISCC_PATH 'packaging\voke.iss' "-dVokeVersion=$env:VOKE_VERSION" "-dVokeExe=$goExe"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败（exit=$LASTEXITCODE）" }
          Get-ChildItem 'packaging\dist'

      - name: 汇总产物（安装包 + portable zip）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item 'packaging\dist\voke-setup-*.exe' -Destination 'dist\'
          Compress-Archive -Path 'poc\voke-go\voke.exe' `
            -DestinationPath "dist\voke-v$env:VOKE_VERSION-windows-x86_64.zip"
          Get-ChildItem 'dist'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: voke-go-release
          path: dist/*
          if-no-files-found: error

      - name: 建 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
