# Voke 发版流水线（Go + mygo 版；Rust 版 CI/发版已退役）。
#
# 触发：
#   - 推 `vX.Y.Z` tag：windows runner 用 Go 构建 voke.exe（GUI + syso 图标），
#     复用生产 packaging/voke.iss 产出安装包 + portable zip；ubuntu runner 用
#     git-cliff 生成 CHANGELOG.md 并建 GitHub Release（行为与原 Rust 发版一致）。
#   - 手动 workflow_dispatch（填版本号）：跑检查 + 构建产物，不建 Release，用于验证打包链路。
#
# 版本号以 tag 为唯一事实来源：exe 的版本资源尚未注入（已知差距），安装器
# AppVersion 与产物文件名由 -dVokeVersion 覆盖，不改 voke.iss。
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（三段，如 0.2.0，不带 v）'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------
  # 发版前检查：tag 必须指向 main 上的 commit，防止从 feature 分支误发版。
  # workflow_dispatch 只验证打包，不做该检查。
  # ---------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure tag commit is on the default branch
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"

  # ---------------------------------------------------------------------
  # 复用 ci.yml 的完整门禁；CI 不过就不 build、不发版。
  # ---------------------------------------------------------------------
  ci:
    needs: [preflight]
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------
  # windows：出安装包 + portable zip。ISCC.exe 是 Windows 原生程序，必须跑
  # windows runner（Go 本体仍可在 WSL 交叉构建，见 ci.yml）。
  # ---------------------------------------------------------------------
  build:
    needs: [preflight, ci]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # 事件字段一律经 env 传入再校验，不直接插值进 shell（防注入）。
      - name: 解析版本号
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'push') {
            $ver = $env:REF_NAME -replace '^v', ''
          } else {
            $ver = $env:INPUT_VERSION
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "版本号不合法（需三段数字）：$ver" }
          "VOKE_VERSION=$ver" >> $env:GITHUB_ENV
          "VOKE_TAG=v$ver" >> $env:GITHUB_ENV
          Write-Host "版本：$ver"

      - name: go build（Windows GUI，含 exe 图标 syso 与版本注入）
        shell: pwsh
        # buildVersion 经 -ldflags -X 注入（设置页「关于」显示）；与安装器
        # -dVokeVersion 同源，均取 tag。Go 没有 build.rs，链接器只改写 string 变量。
        run: |
          $ErrorActionPreference = 'Stop'
          $ldflags = "-s -w -H windowsgui -X voke/internal/app.buildVersion=$env:VOKE_VERSION"
          go build -tags mygo_noinspector -ldflags="$ldflags" -o voke.exe .
          if ($LASTEXITCODE -ne 0) { throw "go build 失败（exit=$LASTEXITCODE）" }

      - name: 安装 Inno Setup 7
        uses: ./.github/actions/install-inno7

      - name: 生成安装包（复用生产 voke.iss，-dVokeExe 指向 Go 产物）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $goExe = (Resolve-Path 'voke.exe').Path
          & $env:ISCC_PATH 'packaging\voke.iss' "-dVokeVersion=$env:VOKE_VERSION" "-dVokeExe=$goExe"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败（exit=$LASTEXITCODE）" }
          Get-ChildItem 'packaging\dist'

      - name: 汇总产物（安装包 + portable zip）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item 'packaging\dist\voke-setup-*.exe' -Destination 'dist\'
          Compress-Archive -Path 'voke.exe' `
            -DestinationPath "dist\voke-$env:VOKE_TAG-windows-x86_64.zip"
          Get-ChildItem 'dist'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: voke-release
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # ubuntu：生成 changelog + 建 GitHub Release，并把 CHANGELOG.md 回推默认分支。
  # 手动触发不进入 release job。
  # ---------------------------------------------------------------------
  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 串行化 changelog 回推，避免两个 tag 同时改 main 时互相打架。
    concurrency:
      group: release-changelog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # 直接在默认分支上生成/提交 changelog，避免 detached HEAD 改文件后再 checkout 的冲突。
          ref: ${{ github.event.repository.default_branch }}
          # git-cliff 要完整历史 + 全部 tag 才能生成 changelog。
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: voke-release
          path: artifacts

      - name: Generate changelog and release body
        shell: bash
        # git-cliff 读 git 历史 + Conventional Commits（cliff.toml）。
        # 只把本版本前置到现有 CHANGELOG，保留 Rust 时代已归档的 v0.1.x 条目；
        # 整份重写只会覆盖 main 可达的标签，会丢历史版本。
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # 重跑 release 时 CHANGELOG 可能已有本版本，避免重复前置。
          if grep -Fq "## [${TAG_NAME#v}]" CHANGELOG.md; then
            echo "CHANGELOG already contains $TAG_NAME, skip prepend"
          else
            git-cliff --latest --tag "$TAG_NAME" --prepend CHANGELOG.md
          fi
          git-cliff --latest --tag "$TAG_NAME" -o release-body.md
          printf '\n---\n' >> release-body.md
          echo "Full changelog: https://github.com/$REPO/blob/$DEFAULT_BRANCH/CHANGELOG.md" >> release-body.md
          echo "Release body:"
          cat release-body.md

      - name: Commit regenerated CHANGELOG.md to the default branch
        shell: bash
        # checkout 已在默认分支上；CHANGELOG.md 没变化时不产生空提交。
        env:
          TAG_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="$DEFAULT_BRANCH"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md 无变化，跳过提交"
            exit 0
          fi
          git add CHANGELOG.md
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "docs: changelog for $TAG_NAME"
          # main 在 build 期间可能前进；push 失败时 rebase 重试。
          for i in 1 2 3; do
            if git push origin "$branch"; then
              echo "CHANGELOG.md 已提交到 $branch"
              exit 0
            fi
            echo "push 失败，第 $i 次重试前先 rebase"
            git pull --rebase origin "$branch"
            sleep 2
          done
          echo "CHANGELOG.md 推送失败（已重试 3 次）" >&2
          exit 1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          # 用 **/ 前缀：不管 upload-artifact 有没有把目录层级带进产物都能命中。
          files: |
            artifacts/**/voke-setup-*.exe
            artifacts/**/voke-*-windows-x86_64.zip
